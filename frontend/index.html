<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IntelliPrep AI: exam prep from your own notes</title>
    <meta name="description" content="Turn your lecture notes and past papers into summaries, flashcards, quizzes and likely exam topics. Study alone or with your class." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IntelliPrep AI" />
    <meta property="og:description" content="Summaries, flashcards, quizzes and exam predictions made from your own notes." />
    <meta name="twitter:card" content="summary" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so every page opens in the right mode
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              primary: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              }
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: "Geist", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: #99f6e4; color: #042f2e; }

      /* ---- Interaction layer ------------------------------------------------------------
         Every control answers the hand: a quick press (scale), a calm hover, a visible focus
         ring for keyboards. Colours come from the existing palette; nothing here recolours. */
      :root {
        --ip-ease: cubic-bezier(.22, 1, .36, 1);      /* settles like a spring, no overshoot */
        --ip-press: cubic-bezier(.3, 0, .5, 1);
        --ip-ring: #14b8a6;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body { caret-color: #0d9488; accent-color: #0d9488; overscroll-behavior-y: none; }
      input, textarea, select { caret-color: #0d9488; }

      /* Press and hover feedback. :where() keeps it below Tailwind utilities, so anything a
         component already sets (its own transition or active:scale) still wins. */
      :where(button, [role="button"], a[href], summary, label[for], select) { touch-action: manipulation; }
      :where(button, [role="button"], a[href], summary) {
        transition-property: color, background-color, border-color, box-shadow, opacity, filter, scale, translate;
        transition-duration: .2s;
        transition-timing-function: var(--ip-ease);
      }
      :where(button, [role="button"], summary):not(:disabled):not([class*="active:scale"]):active { scale: .96; transition-duration: .08s; transition-timing-function: var(--ip-press); }
      :where(a[href]):active { opacity: .7; transition-duration: .08s; }
      @media (hover: hover) {
        :where(button, [role="button"]):not(:disabled):hover { filter: brightness(1.04) saturate(1.04); }
      }
      :where(button, [role="button"]):disabled { cursor: not-allowed; }

      /* Clickable cards (subject cards, saved items): lift on hover, sink on press. */
      :where(.cursor-pointer.rounded-2xl, .cursor-pointer.rounded-xl, .lift) {
        transition: box-shadow .25s var(--ip-ease), translate .25s var(--ip-ease), scale .12s var(--ip-press), border-color .2s var(--ip-ease);
      }
      @media (hover: hover) {
        :where(.cursor-pointer.rounded-2xl, .cursor-pointer.rounded-xl, .lift):hover {
          translate: 0 -2px;
          box-shadow: 0 12px 28px -14px rgba(15, 23, 42, .22), 0 2px 6px -2px rgba(15, 23, 42, .06);
        }
      }
      :where(.cursor-pointer.rounded-2xl, .cursor-pointer.rounded-xl, .lift):active { scale: .985; translate: 0 0; }

      /* Fields: the border and ring ease in instead of snapping. */
      :where(input, textarea, select) { transition: border-color .2s var(--ip-ease), box-shadow .2s var(--ip-ease), background-color .2s var(--ip-ease); }

      /* Keyboard focus, always visible (mouse clicks don't show it). */
      :where(button, a[href], input, textarea, select, summary, [role="button"], [tabindex]):focus-visible {
        outline: 2px solid var(--ip-ring);
        outline-offset: 2px;
      }

      /* Touch screens: grow small controls' tap area to about 44px without changing their look. */
      @media (pointer: coarse) {
        :where(button, [role="button"]):not([class*="absolute"]):not([class*="fixed"]):not([class*="sticky"]) { position: relative; }
        :where(button, [role="button"])::after { content: ""; position: absolute; inset: -7px; }
      }

      /* Panels, tabs and sheets open with a short settle; pages cross-fade. */
      .animate-in { animation: ip-enter .32s var(--ip-ease) both; }
      @keyframes ip-enter { from { opacity: 0; transform: translateY(6px) scale(.99); } }
      .ip-page { animation: ip-page .28s var(--ip-ease) both; }
      @keyframes ip-page { from { opacity: 0; } }  /* opacity only: a transform would trap fixed bars */
      /* The assistant grows out of its button, like an iOS sheet: scale, rise and un-blur. */
      .ip-sheet { transform-origin: bottom right; animation: ip-sheet .38s var(--ip-ease) both; }
      @keyframes ip-sheet { from { opacity: 0; transform: translateY(14px) scale(.9); filter: blur(6px); } }

      /* Scrollbars, thin and quiet, from the same greys. */
      * { scrollbar-width: thin; scrollbar-color: rgba(100, 116, 139, .35) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, .35); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, .55); }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Notched phones: bars clear the home indicator. */
      .ip-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

      /* Very wide screens: tab content keeps a readable width instead of stretching. */
      .ip-content > * { width: 100%; max-width: 1440px; margin-inline: auto; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        :where(button, [role="button"], summary):active { scale: 1; }
        :where(.cursor-pointer.rounded-2xl, .cursor-pointer.rounded-xl, .lift):hover { translate: none; }
      }

      /* Dark mode: give light-only utility classes a dark counterpart.
         Elements that already set their own dark: classes are left alone. */
      .dark { color-scheme: dark; }
      .dark ::selection { background: #115e59; color: #f0fdfa; }
      .dark :is(.bg-white, .bg-[#fafbff], .bg-[#fafafa]):not([class*="dark:bg-"]) { background-color: #1f2937; }
      .dark :is(.bg-gray-50, .bg-slate-50, .bg-gray-50/50, .bg-slate-50/50, .bg-gray-50/80):not([class*="dark:bg-"]) { background-color: #111827; }
      .dark :is(.bg-gray-100, .bg-slate-100, .bg-gray-200):not([class*="dark:bg-"]) { background-color: #374151; }
      .dark :is(.bg-primary-50, .bg-emerald-50, .bg-green-50, .bg-teal-50):not([class*="dark:bg-"]) { background-color: rgba(20, 184, 166, .12); }
      .dark :is(.bg-red-50, .bg-red-100, .bg-orange-50, .bg-amber-50, .bg-pink-50, .bg-rose-50):not([class*="dark:bg-"]) { background-color: rgba(248, 113, 113, .12); }
      .dark :is(.bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-cyan-50):not([class*="dark:bg-"]) { background-color: rgba(96, 165, 250, .12); }
      .dark :is(.text-gray-900, .text-gray-800, .text-slate-900, .text-slate-800, .text-gray-950, .text-slate-950):not([class*="dark:text-"]) { color: #f3f4f6; }
      .dark :is(.text-gray-700, .text-gray-600, .text-slate-700, .text-slate-600):not([class*="dark:text-"]) { color: #d1d5db; }
      .dark :is(.text-gray-500, .text-slate-500):not([class*="dark:text-"]) { color: #9ca3af; }
      .dark :is(.border-gray-200, .border-gray-100, .border-slate-200, .border-slate-100, .border-gray-300, .border-gray-200/50):not([class*="dark:border-"]) { border-color: #374151; }
      .dark :is(.hover:bg-gray-50, .hover:bg-gray-100, .hover:bg-slate-50, .hover:bg-slate-100):hover:not([class*="dark:hover:bg-"]) { background-color: #374151; }
      .dark :is(.divide-gray-100, .divide-gray-200) > * + * { border-color: #374151; }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .dark .glass-panel {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      /* 3D Flashcard Transitions */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
</head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
